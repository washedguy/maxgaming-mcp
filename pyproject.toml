[project]
name = "maxgaming-mcp"
version = "1.0.0"
description = "Request-based MCP server for MaxGaming"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3.0,<3", "curl-cffi>=0.17.0,<1"]

[project.scripts]
maxgaming-mcp = "maxgaming_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maxgaming_mcp"]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"